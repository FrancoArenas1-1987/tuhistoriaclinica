name: tuhistoriaclinica
services:
  tuhistoriaclinica:
    build: .
    image: tuhistoriaclinica-web:local
    container_name: tuhistoriaclinica-web
    env_file:
      - .env
    environment:
      STORAGE_DIR: /app/storage
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"
    networks:
      - proxy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: conectapro-platform_default
